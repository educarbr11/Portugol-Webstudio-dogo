<ng-keyboard-shortcuts [shortcuts]="shortcuts" />

<header class="workspace-topbar">
  <button class="workspace-brand" type="button" aria-label="Ir para o início" (click)="selected.setValue(0)">
    <span class="brand-mark"><svg-icon src="assets/lightbulb.svg" aria-hidden="true" focusable="false" /></span>
    <span class="brand-name">Dogol <small>Portugol Webstudio</small></span>
  </button>
  <nav class="workspace-shortcuts" aria-label="Acesso rápido">
    <button type="button" aria-label="Abrir ajuda" (click)="upsertHelpTab()">
      <svg-icon src="assets/mdi/book-open-page-variant-outline.svg" aria-hidden="true" focusable="false" />
      <span>Ajuda</span>
    </button>
    <button type="button" aria-label="Abrir configurações" (click)="openSettingsModal()">
      <svg-icon src="assets/mdi/cog-outline.svg" aria-hidden="true" focusable="false" />
      <span>Configurações</span>
    </button>
  </nav>
</header>

<div id="preload">
  <ngx-monaco-editor />
</div>

<mat-tab-group
  class="workspace-tabs"
  animationDuration="0"
  mat-stretch-tabs="false"
  mat-align-tabs="start"
  [preserveContent]="true"
  [selectedIndex]="selected.value"
  (selectedIndexChange)="selected.setValue($event)"
>
  <mat-tab labelClass="tab-home">
    <ng-template mat-tab-label>
      <span class="tab-icon">
        <svg-icon
          src="assets/lightbulb.svg"
          svgClass="text-primary cap-my-height"
          aria-hidden="true"
          focusable="false"
        />
      </span>

      <span class="tab-text">Início</span>
    </ng-template>

    <app-tab-start
      (newTab)="addTab($event?.name, $event?.contents)"
      (help)="upsertHelpTab()"
      (settings)="openSettingsModal()"
    />
  </mat-tab>

  @for (tab of tabs; track tab.id) {
    <mat-tab [labelClass]="`tab-item tab-${tab.type}`">
      <ng-template mat-tab-label>
        <span>
          <span class="tab-icon">
            @switch (tab.type) {
              @case ("editor") {
                <svg-icon src="assets/mdi/file-document-outline.svg" svgAriaLabel="Ícone de documento" />
              }

              @case ("help") {
                <svg-icon
                  src="assets/mdi/help-circle-outline.svg"
                  svgClass="text-blue"
                  aria-hidden="true"
                  focusable="false"
                />
              }
            }
          </span>

          <span class="tab-text" [title]="tab.title">{{ tab.title }}</span>
        </span>

        <span class="tab-actions">
          @if (tab.type === "editor") {
            <button
              mat-icon-button
              aria-label="Renomear aba"
              matTooltip="Renomear aba"
              type="button"
              (click)="$event.stopPropagation(); changeTabTitle(tab)"
            >
              <svg-icon src="assets/mdi/rename-outline.svg" aria-hidden="true" focusable="false" />
            </button>
          }

          <button
            mat-icon-button
            aria-label="Fechar aba"
            matTooltip="Fechar aba"
            type="button"
            [class.single-button]="tab.type === 'editor'"
            (click)="$event.stopPropagation(); closeTab(tab)"
          >
            <svg-icon src="assets/mdi/close.svg" aria-hidden="true" focusable="false" />
          </button>
        </span>
      </ng-template>

      @switch (tab.type) {
        @case ("editor") {
          <app-tab-editor
            [active]="selected.value === $index + 1"
            [code]="tab.contents"
            [(title)]="tab.title"
            (help)="upsertHelpTab()"
            (settings)="openSettingsModal()"
          />
        }

        @case ("help") {
          <app-tab-help (newTab)="addTab($event.name, $event.contents)" />
        }
      }
    </mat-tab>
  }

  <mat-tab labelClass="tab-item tab-action tab-action-add" disabled>
    <ng-template mat-tab-label>
      <button
        class="action-button add-button"
        mat-icon-button
        aria-label="Nova aba de editor de código"
        aria-disabled="false"
        matTooltip="Nova aba de editor de código"
        type="button"
        (click)="addTab()"
      >
        <svg-icon src="assets/mdi/plus.svg" aria-hidden="true" focusable="false" />
      </button>
    </ng-template>
  </mat-tab>
</mat-tab-group>

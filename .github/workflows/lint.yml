name: Build and Lint
permissions:
  contents: read
on: pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies 🔧
        run: pnpm install --frozen-lockfile

      - name: Build code 🚚
        run: |
          pnpm run build
          pnpm run release

      - name: Lint 🚨
        run: pnpm run lint

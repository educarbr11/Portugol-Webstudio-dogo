name: Publish
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://npm.pkg.github.com"
          scope: "@portugol-webstudio"

      - name: Install dependencies 🔧
        run: pnpm install --frozen-lockfile

      - name: Build code 🚚
        run: |
          pnpm run build
          pnpm run release

      - name: Publish 🚀
        run: |
          cp -r LICENSE packages/*
          pnpm exec lerna publish 0.0.0-dev.${{ github.run_number }} --no-git-tag-version --no-push --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_GITHUB_TOKEN }}
